[project]
name = "mindmap-agent"
version = "0.0.1"
description = "Agent 任务图引擎 · Python 无状态引擎（§3.1 的第三层）"
requires-python = ">=3.12"

# 依赖是【按需长出来的】，不是一次配齐的：
#
#   骨架阶段是零依赖 —— "flat level 列表组装成树"用标准库就写完了。
#   接 DeepSeek 时长了两个：
#     · openai        —— DeepSeek 走 OpenAI 兼容接口，省得自己搓 HTTP/鉴权/超时
#     · python-dotenv —— 见下面「为什么需要它」
#
# LangChain / LangGraph（§1.5）等到 A3/A4 真用上再加。
# 提前装 = 让 A1 的环境复现多背几个用不上的包（uv.lock 是要提交的）。
dependencies = [
    "openai>=3.14.0",
    "python-dotenv>=1.2.3",
]

# ⚑ 为什么需要 python-dotenv：**实测过 `uv run` 不会自动读 `.env`**
#   （往 .env 里放一个变量，`uv run python -c "import os;print(os.environ.get(...))"` 读到 None）。
#
#   替代方案是在 Makefile 里写 `uv run --env-file .env`，但那会造成两条入口行为不一致：
#   `make plan` 读了 .env，而手动 `uv run python -m app.cli` 调试时不读 ——
#   "换个方式跑就得到不同结果"正是这个项目最烦的坑。
#   所以把加载放进代码（cli.py 里 load_dotenv()），两条入口都一样。

[tool.uv]
# ⚑ 下面两行都不是可选的。
#
# ① package = false
#    本项目不是要发到 PyPI 的包，没有 build backend。
#    不写这行，uv 会去找一个 backend 来"安装"本项目自己，然后报错。
#
# ② python-preference = "only-system"
#    uv 默认会去 github 下载它自己管版的 Python
#    （astral-sh/python-build-standalone，不是 PyPI）。
#    而这台机器上 github 是【要挂代理才通】的 —— 代理没开时，
#    uv sync 会卡在一个和本项目毫无关系的网络请求上。
#    限定只用系统 Python（uv python list 已找到 cpython-3.12.6）即可绕开。
package = false
python-preference = "only-system"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 让 tests/ 里能直接 `import app...`。
# 不写这行，pytest 默认只把 tests/ 目录塞进 sys.path（它按"最靠近的没有 __init__.py 的父目录"算），
# 于是 import app 会失败 —— 而报错信息看起来像"模块不存在"，很费时间。
pythonpath = ["."]
testpaths = ["tests"]
